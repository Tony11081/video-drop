<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TonyBook 微缩</title>
<style>html,body{margin:0;background:#000;overflow:hidden} canvas{display:block}</style>
</head>
<body>
<script type="module">
import { Engine } from './engine.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1920;
const cue = await (await fetch('episodes/' + q.get('ep') + '.json?' + Date.now())).json();
for (const w of [900, 700, 500]) await document.fonts.load(`${w} 64px "Noto Sans CJK SC"`, '跨境TonyBook');
const t0 = performance.now();
const engine = new Engine(cue, W, H);
window.engine = engine;
window.buildMs = performance.now() - t0;
window.renderAndSend = async (i, n) => {
  const a = performance.now();
  const used = engine.renderFrame(i, n ? { subframes: n } : {});
  const px = engine.pixels();
  const b = performance.now();
  const res = await fetch('/frame?i=' + i, { method: 'POST', body: px });
  if (!res.ok) throw new Error('post failed ' + res.status);
  return { ms: b - a, sub: used };
};
window.ready = true;
</script>
</body>
</html>
