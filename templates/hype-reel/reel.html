<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{--lime:#C8FF00;--ink:#0b0c0a;--paper:#f6f7f3;--warn:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0c0a}
body{font-family:"Inter Display","Inter","Noto Sans CJK SC",sans-serif;font-weight:900;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0}
.abs{position:absolute}
.mono{font-family:"DejaVu Sans Mono",monospace;font-weight:700;letter-spacing:.12em}
.zh{font-family:"Noto Sans CJK SC","Inter Display",sans-serif;font-weight:900}
.num{font-family:"Inter Display","Inter",sans-serif;font-weight:900;letter-spacing:-.045em;line-height:.86}
.center{left:0;right:0;text-align:center}
.strip{display:inline-block;background:var(--lime);color:var(--ink);padding:10px 34px 16px;line-height:1.1}
.grid{background-image:radial-gradient(rgba(11,12,10,.16) 2px,transparent 2.4px);background-size:36px 36px}
</style></head>
<body><div id="stage"></div>
<script>
const BEAT = 0.4, FPS = 30, TOTAL = 20.0;
const LIME = "#C8FF00", INK = "#0b0c0a", PAPER = "#f6f7f3";
const FACTS = [
  { img: "sketch", tag: "EP.029 · 下架申诉", big: "1", unit: "次", label: "每个商品只能申诉一次", punch: "被驳回就不能再申诉" },
  { img: "reserve", tag: "EP.024 · 付款保证金", big: "90", unit: "天", label: "大多数卖家 90 天内解除", punch: "求客服没用" },
  { img: "ship", tag: "EP.022 · 发美国", big: "DDP", unit: "", label: "关税和进口费 卖家预付", punch: "7 月 9 日起 必须用" },
  { img: "board", tag: "EP.021 · Etsy 广告", big: "$25", unit: "", label: "单品策略的日预算门槛", punch: "不到就用不了" },
  { img: "ship2", tag: "EP.014 · 欧盟海关", big: "€2", unit: "", label: "每种商品收一笔处理费", punch: "不看包裹价值" },
  { img: "studio", tag: "EP.020 · 旺季发货", big: "80%", unit: "", label: "订单按时发货的及格线", punch: "按你自己设的发货日算" },
];
const WORDS = ["封店", "侵权", "申诉", "关税", "保证金", "广告", "评分", "发货"];
const HOOK = ["Etsy", "新规", "一条", "接一条"];

const IMG = { sketch: ["sourcing-sketch.webp", 34], reserve: ["note-payment-reserve.webp", 52], ship: ["note-shipping-tracking.webp", 50],
  studio: ["hero-studio.webp", 72], board: ["product-photo.webp", 62], ship2: ["note-shipping-tracking.webp", 82], reserve2: ["note-payment-reserve.webp", 30] };
// full-bleed still: slow push-in over the scene, hard punch-in at `punchAt` seconds, 1-beat micro drift
function still(key, lt, punchAt = 0.8, dur = 1.6) {
  const [file, fx] = IMG[key];
  const z = 1.06 + 0.07 * clamp(lt / dur) + (lt >= punchAt ? 0.16 : 0);
  const dx = (lt >= punchAt ? -14 : 10) * clamp(lt / dur);
  return `<div class="layer" style="background:url(assets/${file}) ${fx}% 50%/auto 100% no-repeat;transform:translateX(${dx.toFixed(1)}px) scale(${z.toFixed(4)});filter:saturate(1.08) contrast(1.05)"></div>`;
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// slam: big -> 1 with overshoot, returns css transform + opacity for local time lt (s) since cue
function slam(lt, from = 2.1, dur = 0.17) {
  if (lt < 0) return "opacity:0;";
  const p = clamp(lt / dur), s = from + (1 - from) * back(p);
  return `opacity:${clamp(lt / 0.05)};transform:scale(${s.toFixed(4)});`;
}
function rise(lt, dy = 70, dur = 0.16) {
  if (lt < 0) return "opacity:0;";
  const p = easeOut(lt / dur);
  return `opacity:${p.toFixed(3)};transform:translateY(${((1 - p) * dy).toFixed(1)}px);`;
}
function wipe(lt, dur = 0.14) { // strip wipes in from left
  if (lt < 0) return "opacity:0;";
  const p = easeOut(lt / dur);
  return `clip-path:inset(0 ${(100 - p * 100).toFixed(1)}% 0 0);`;
}
function flash(lt, color = "#fff", a = 0.85, dur = 0.1) {
  if (lt < 0 || lt > dur) return "";
  return `<div class="layer" style="background:${color};opacity:${(a * (1 - lt / dur)).toFixed(3)}"></div>`;
}
function shake(lt, amp = 14, dur = 0.16) {
  if (lt < 0 || lt > dur) return "";
  const k = 1 - lt / dur, f = Math.round(lt * FPS);
  const dx = ((f * 7919) % 5 - 2) / 2 * amp * k, dy = ((f * 104729) % 5 - 2) / 2 * amp * k;
  return `transform:translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px);`;
}
function hud(dark, right) {
  const c = dark ? "rgba(255,255,255,.78)" : "rgba(11,12,10,.72)";
  return `<div class="abs mono" style="left:72px;top:150px;font-size:26px;color:${c}">SHOPWRIGHT</div>
          <div class="abs mono" style="right:72px;top:150px;font-size:26px;color:${c}">${right}</div>
          <div class="abs" style="left:72px;right:72px;top:200px;height:3px;background:${c};opacity:.5"></div>`;
}
const scrim = (a = 0.5) => `<div class="layer" style="background:linear-gradient(180deg,rgba(6,8,4,${a + 0.22}) 0%,rgba(6,8,4,${a}) 30%,rgba(6,8,4,${a}) 70%,rgba(6,8,4,${a + 0.3}) 100%)"></div>`;

function hook(b, t) {
  let h = `<div class="layer" style="background:${INK}"></div>` + hud(true, "POLICY BRIEF");
  const y0 = 400, lh = 262;
  HOOK.forEach((w, i) => {
    const lt = t - i * BEAT; if (lt < 0) return;
    const cur = Math.floor(b) === i, last = i === 3;
    const col = last ? INK : (cur ? LIME : "#fff");
    const inner = last ? `<span class="strip" style="padding:0 30px 14px">${w}</span>` : w;
    h += `<div class="abs zh" style="left:72px;top:${y0 + i * lh}px;font-size:${i === 0 ? 250 : 226}px;line-height:1;color:${col};transform-origin:left center;${slam(lt, 1.7)}">${i === 0 ? `<span class="num" style="letter-spacing:-.03em">${w}</span>` : inner}</div>`;
  });
  const bi = Math.floor(b);
  h += flash(t - bi * BEAT, bi === 3 ? LIME : "#fff", 0.35, 0.08);
  return h;
}

function fact(i, lb, lt) { // lb: local beats 0..4
  const f = FACTS[i];
  let h = still(f.img, lt) + scrim(0.56) + hud(true, `0${i + 1} / 06`);
  h += `<div class="abs mono" style="left:72px;top:480px;font-size:34px;color:${LIME};${rise(lt, 30)}"><span style="display:inline-block;width:18px;height:18px;background:${LIME};margin-right:18px;vertical-align:middle"></span>${f.tag}</div>`;
  const long = f.big.length >= 3;
  const fs = long ? 370 : 520;
  h += `<div class="abs" style="left:60px;top:${long ? 600 : 520}px;${shake(lt)}"><div style="transform-origin:left 60%;white-space:nowrap;${slam(lt, 2.3)}">
          <span class="num" style="font-size:${fs}px;color:${LIME};text-shadow:0 10px 60px rgba(0,0,0,.45)">${f.big}</span>${f.unit ? `<span class="zh" style="font-size:210px;color:#fff;margin-left:24px">${f.unit}</span>` : ""}</div></div>`;
  h += `<div class="abs zh" style="left:72px;right:60px;top:1090px;font-size:80px;line-height:1.2;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);${rise(lt - BEAT)}">${f.label}</div>`;
  h += `<div class="abs zh" style="left:72px;top:1230px;font-size:74px;${wipe(lt - 2 * BEAT)}"><span class="strip">${f.punch}</span></div>`;
  h += flash(lt, "#fff", 0.8, 0.1) + flash(lt - 2 * BEAT, LIME, 0.4, 0.08);
  return h;
}

function words(lb, lt) {
  const i = clamp(Math.floor(lb), 0, 7), w = WORDS[i], ll = lt - i * BEAT, mode = i % 3;
  const fs = w.length >= 3 ? 330 : 470;
  let bg, col, extra = "";
  if (mode === 0) { bg = `<div class="layer" style="background:${LIME}"></div>`; col = INK; }
  else if (mode === 1) { bg = still(["reserve2", "sketch", "studio"][(i - 1) / 3], ll, 0.2, 0.4) + scrim(0.45); col = "#fff"; }
  else { bg = `<div class="layer" style="background:${INK}"></div>`; col = LIME; }
  let h = bg + hud(mode !== 0, `EP.${String(Math.min(29, 3 + i * 4)).padStart(3, "0")}`);
  h += `<div class="abs center zh" style="top:${w.length >= 3 ? 700 : 610}px;font-size:${fs}px;line-height:1;color:${col};white-space:nowrap;${slam(ll, 1.5, 0.12)}">${w}</div>`;
  h += `<div class="abs center mono" style="top:1180px;font-size:34px;color:${col};opacity:.8">讲过 · ${String(i + 1).padStart(2, "0")} / 08</div>`;
  h += flash(ll, mode === 0 ? "#fff" : LIME, 0.3, 0.07);
  return h;
}

function count(lb, lt) {
  const n = Math.max(1, Math.round(29 * easeOut(lt / 0.36)));
  let h = still("board", lt, 0.8) + scrim(0.58) + hud(true, "EP.001 – 029");
  h += `<div class="abs mono" style="left:72px;top:480px;font-size:34px;color:${LIME};${rise(lt, 30)}">已经更新</div>`;
  h += `<div class="abs" style="left:60px;top:520px;${shake(lt - 0.36)}"><div style="transform-origin:left 60%;white-space:nowrap;${slam(lt, 1.6)}"><span class="num" style="font-size:560px;color:${LIME}">${n}</span><span class="zh" style="font-size:210px;color:#fff;margin-left:24px">期</span></div></div>`;
  h += `<div class="abs zh" style="left:72px;top:1120px;font-size:120px;line-height:1.1;color:#fff;${rise(lt - 2 * BEAT)}">每天一条</div>`;
  h += flash(lt, "#fff", 0.8, 0.1);
  return h;
}

function take(lb, lt) {
  let h = `<div class="layer" style="background:${INK}"></div>` + hud(true, "OUR TAKE");
  h += `<div class="abs zh" style="left:72px;top:520px;font-size:150px;line-height:1.1;color:rgba(255,255,255,.55);${rise(lt)}">不只是<br>念政策</div>`;
  h += `<div class="abs" style="left:72px;top:520px;width:${(clamp((lt - 1.5 * BEAT) / 0.14) * 620).toFixed(0)}px;height:12px;margin-top:358px;background:${LIME}"></div>`;
  h += `<div class="abs zh" style="left:60px;top:930px;font-size:176px;line-height:1.08;color:${LIME};transform-origin:left center;${slam(lt - 2 * BEAT, 1.8)}">每期一个<br>观点</div>`;
  h += flash(lt - 2 * BEAT, LIME, 0.45, 0.08);
  return h;
}

function end(lb, lt) {
  let h = `<div class="layer" style="background:${PAPER}"></div><div class="layer grid" style="opacity:.55"></div>` + hud(false, "POLICY BRIEF");
  h += `<div class="abs" style="left:72px;top:470px;transform-origin:left center;${slam(lt, 1.5)}"><div class="num" style="font-size:300px;color:${INK}">Etsy</div><div class="zh" style="font-size:218px;line-height:1.1;color:${INK};margin-top:14px">政策速递</div></div>`;
  const pulse = 1 + 0.06 * Math.max(0, 1 - ((lb - 1) % 1) / 0.5) * (lb >= 1 && lb < 5 ? 1 : 0);
  h += `<div class="abs zh" style="left:72px;top:1090px;font-size:84px;transform-origin:left center;transform:scale(${pulse.toFixed(3)})"><div style="${wipe(lt - BEAT)}"><span class="strip" style="padding:14px 40px 22px"><span style="font-family:Inter Display;margin-right:16px">+</span>关注 · 每天一条</span></div></div>`;
  h += `<div class="abs mono" style="left:72px;top:1262px;font-size:28px;color:rgba(11,12,10,.6);${rise(lt - 2 * BEAT, 20)}">Shopwright · openaigrowth.com</div>`;
  h += flash(lt, "#fff", 0.95, 0.14);
  return h;
}

function seek(t) {
  const b = t / BEAT; let h;
  if (b < 4) h = hook(b, t);
  else if (b < 28) { const i = Math.floor((b - 4) / 4); h = fact(i, b - 4 - i * 4, t - (4 + i * 4) * BEAT); }
  else if (b < 36) h = words(b - 28, t - 28 * BEAT);
  else if (b < 40) h = count(b - 36, t - 36 * BEAT);
  else if (b < 44) h = take(b - 40, t - 40 * BEAT);
  else h = end(b - 44, t - 44 * BEAT);
  document.getElementById("stage").innerHTML = h;
}
window.seek = seek; window.TOTAL = TOTAL; seek(0);
</script></body></html>
