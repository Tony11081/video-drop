<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TonyBook 跨境 · 图解工作台模板</title>
<style>
/* TonyBook 跨境 · 图解工作台（样片 2026-11-18，待 Tony 定）
   米色手账纸 + 墨蓝线条 + 珊瑚橙重点；画面全是自己画的图解（产品、色卡、名字图），不用外部素材，
   讲「我们怎么做」时画面和旁白一一对得上。和 Etsy-Tony（56 号暖白青柠、63 号新闻台、纪录片、微缩城市）不混用。 */
:root{
  --paper:#F3EEE3; --paper2:#EAE3D4; --ink:#1B2232; --ink2:#46506a; --muted:#7a7f8c;
  --coral:#FF6B4A; --coral2:#E2502F; --line:rgba(27,34,50,.14); --card:#FFFDF8;
  --sans:"Noto Sans CJK SC",sans-serif; --serif:"Noto Serif SC",serif; --it:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 1px 1px,rgba(27,34,50,.13) 1.6px,transparent 2px) 0 0/40px 40px,
    radial-gradient(1200px 900px at 80% 10%,rgba(255,107,74,.10),transparent 60%),
    linear-gradient(180deg,var(--paper),var(--paper2))}
#grain{position:absolute;inset:-60px;opacity:.10;pointer-events:none;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>")}

/* masthead */
.head{position:absolute;left:72px;right:72px;top:104px;display:flex;justify-content:space-between;align-items:center;
  font:700 27px/1 var(--sans);letter-spacing:.24em;color:var(--ink)}
.head .brand i{font-style:normal;color:var(--coral)}
.head .no{font:600 26px/1 var(--sans);letter-spacing:.16em;color:var(--ink2)}
.rule{position:absolute;left:72px;right:72px;top:150px;height:3px;background:var(--ink)}
.rule2{position:absolute;left:72px;right:72px;top:158px;height:1px;background:var(--ink)}
#dots{position:absolute;left:72px;right:72px;top:190px;display:flex;gap:12px;align-items:center}
#dots .d{height:10px;flex:1;border-radius:6px;background:rgba(27,34,50,.12);overflow:hidden;position:relative}
#dots .d i{position:absolute;inset:0;background:var(--coral);transform-origin:left;transform:scaleX(0)}
#topic{position:absolute;left:72px;right:72px;top:228px;font:600 34px/1.3 var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* scenes live in y 300–1310 */
.scene{position:absolute;left:0;right:0;top:300px;height:1020px;will-change:transform,opacity}
.step{position:absolute;left:72px;top:10px;display:flex;align-items:center;gap:22px}
.step .num{width:104px;height:104px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  font:700 50px/1 var(--sans);letter-spacing:-.02em}
.step .tt{font:800 70px/1.15 var(--serif);color:var(--ink)}
.step .tt em{font-style:normal;color:var(--coral)}
.anim{will-change:transform,opacity}

/* note lines */
.notes{position:absolute;left:72px;right:72px}
.nl{font:600 50px/1.35 var(--sans);color:var(--ink);padding:10px 0 10px 34px;border-left:8px solid var(--coral);margin-bottom:22px;background:linear-gradient(90deg,rgba(255,107,74,.10),transparent 70%)}
.nl b{color:var(--coral2)}
.tagl{position:absolute;font:700 34px/1.2 var(--sans);color:var(--paper);background:var(--ink);padding:14px 22px;border-radius:14px;white-space:nowrap}
.tagl.c{background:var(--coral)}
.tagl::after{content:"";position:absolute;width:0;height:0;border:14px solid transparent}
.tagl.l::after{left:-26px;top:50%;margin-top:-14px;border-right-color:inherit}
.small{position:absolute;font:500 26px/1.4 var(--sans);color:var(--muted)}

/* cards */
.card{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:12px 12px 0 rgba(27,34,50,.95)}
.card .cl{font:700 24px/1 var(--sans);letter-spacing:.24em;color:var(--coral2);text-transform:uppercase}

/* cover */
.q{position:absolute;left:72px;right:72px;top:70px;font:900 104px/1.2 var(--serif);color:var(--ink);letter-spacing:.01em}
.q em{font-style:normal;color:var(--coral)}
.stamp{position:absolute;right:70px;top:500px;width:330px;height:330px;border-radius:50%;border:8px solid var(--coral);color:var(--coral);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);background:rgba(255,253,248,.7)}
.stamp .s1{font:700 30px/1.2 var(--sans);letter-spacing:.2em}
.stamp .s2{font:900 76px/1.15 var(--serif);margin-top:8px}
.chips3{position:absolute;left:72px;top:880px;display:flex;gap:16px}
.chips3 span{font:700 34px/1 var(--sans);padding:18px 26px;border:3px solid var(--ink);border-radius:40px;background:var(--card)}

/* swatches */
.sw{position:absolute;display:grid;grid-template-columns:repeat(5,148px);gap:18px}
.sw .c{height:118px;border-radius:18px;border:3px solid var(--ink);position:relative;display:flex;align-items:flex-end;justify-content:flex-start;padding:8px 12px;
  font:800 30px/1 var(--sans);color:rgba(27,34,50,.85);overflow:hidden}
.sw .c.dk{color:rgba(255,255,255,.92)}
.sw .c.on{outline:8px solid var(--coral);outline-offset:4px}

/* name image */
.nameimg{background:#fff;border:3px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;
  font:700 italic 170px/1 var(--it);color:#000;position:absolute}
.mat{position:absolute;width:250px;height:170px;border-radius:18px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font:700 italic 92px/1 var(--it);box-shadow:8px 8px 0 rgba(27,34,50,.9)}
.matl{position:absolute;font:700 32px/1 var(--sans);color:var(--ink);width:250px;text-align:center}

/* todo */
.todo{position:absolute;left:72px;right:72px;top:180px;padding:40px 46px}
.todo .row{display:flex;align-items:center;gap:30px;padding:44px 0;border-top:2px dashed var(--line);font:800 60px/1.3 var(--sans)}
.todo .row:first-of-type{border-top:0}
.todo .bx{width:70px;height:70px;border:5px solid var(--ink);border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font:900 46px/1 var(--sans);color:#fff}
.todo .n{font:900 44px/1 var(--sans);color:var(--coral);width:40px}
.fine{position:absolute;left:72px;right:72px;font:500 28px/1.5 var(--sans);color:var(--muted)}

/* captions */
#cap{position:absolute;left:60px;right:60px;top:1360px;height:150px;display:flex;align-items:center;justify-content:center}
#cap .c{position:absolute;max-width:100%;text-align:center;font:800 62px/1.25 var(--sans);color:var(--ink);
  background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px 30px;box-shadow:8px 8px 0 rgba(27,34,50,.95);white-space:nowrap}
#cap .c b{color:var(--coral2)}
#src{position:absolute;left:72px;right:72px;top:1545px;text-align:center;font:500 22px/1.4 var(--sans);color:var(--muted)}
</style>
</head>
<body>
<div id="stage">
  <div id="grain"></div>
  <div class="head"><div class="brand">TONYBOOK <i>·</i> 跨境图解</div><div class="no" id="epno"></div></div>
  <div class="rule"></div><div class="rule2"></div>
  <div id="dots"></div>
  <div id="topic"></div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="src"></div>
</div>
<script>
const ep = new URLSearchParams(location.search).get("ep") || "ep022";
const s = document.createElement("script");
s.src = "episodes/" + ep + ".js";
s.onload = () => { const e = document.createElement("script"); e.src = "engine.js"; document.body.appendChild(e); };
document.body.appendChild(s);
</script>
</body>
</html>
