<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TonyBook 跨境 · 4 号极简杂志模板</title>
<style>
/* TonyBook 跨境 · 极简杂志（模板库 4 号，2026-10-31 Tony 选定）
   深墨底 + 细线刊头 + 衬线大标题 + 毛玻璃卡片，唯一强调色珊瑚橙 #FF6B4A。
   和 Shopwright（暖白底、青柠绿）分开，不混用。 */
:root{
  --ink:#0c0c0e; --ink2:#141417; --line:rgba(255,255,255,.72); --hair:rgba(255,255,255,.18);
  --text:#f4f1ea; --muted:rgba(244,241,234,.62);
  --coral:#ff6b4a; --coral2:#ff9a78; --mint:#7fe0b4;
  --glass:rgba(255,255,255,.075); --glassb:rgba(255,255,255,.22);
  --sans:"Noto Sans CJK SC","Inter",sans-serif;
  --serif:"Noto Serif SC","Noto Serif CJK SC",serif;
  --latin:"Inter","Noto Sans CJK SC",sans-serif;
  --disp:"Inter Display","Inter",sans-serif;
  --it:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
/* moving light behind the glass */
#glow{position:absolute;inset:0;
  background:
    radial-gradient(760px 620px at var(--gx,78%) var(--gy,22%),rgba(255,107,74,.30),transparent 62%),
    radial-gradient(900px 760px at var(--hx,12%) var(--hy,74%),rgba(120,92,255,.16),transparent 62%),
    radial-gradient(700px 500px at 50% 108%,rgba(255,154,120,.12),transparent 70%),
    linear-gradient(180deg,var(--ink2),var(--ink) 60%)}
/* hook / cover photo (from Codex), fades out after the first page */
#cover{position:absolute;inset:0;background-size:cover;background-position:center bottom;opacity:0}
#cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,12,14,.55) 0,rgba(12,12,14,.25) 34%,rgba(12,12,14,.15) 55%,rgba(12,12,14,.72) 82%,rgba(12,12,14,.92))}
#grain{position:absolute;inset:-60px;opacity:.07;pointer-events:none;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>")}

/* masthead */
.issue{position:absolute;left:72px;right:72px;top:112px;display:flex;justify-content:space-between;align-items:flex-end;
  font:500 26px/1 var(--latin);letter-spacing:.32em;color:rgba(255,255,255,.92);border-bottom:2px solid var(--line);padding-bottom:20px}
.issue b{font-weight:700}
.issue b i{font-style:normal;color:var(--coral)}
.kick{position:absolute;left:72px;right:72px;top:172px;display:flex;align-items:center;gap:18px;
  font:600 24px/1 var(--latin);letter-spacing:.3em;color:var(--coral2)}
.kick::before{content:"";width:46px;height:3px;background:var(--coral)}
.kick span{color:var(--muted);letter-spacing:.12em;font:500 26px/1 var(--sans)}
.topic{position:absolute;left:72px;right:72px;top:226px;font:600 46px/1.3 var(--serif);color:var(--text);letter-spacing:.02em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* content viewport */
#view{position:absolute;left:0;right:0;top:372px;height:930px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 40px,#000 100%)}
#chat{position:absolute;left:0;right:0;top:20px}
.msg{position:absolute;left:0;right:0;will-change:transform,opacity}
.body{margin:0 72px}
.hl{color:#fff;font-weight:700;background:linear-gradient(transparent 80%,var(--coral) 80%,var(--coral) 93%,transparent 93%);padding:0 2px}

/* hook question = cover headline */
.u .bub{display:block;font:700 96px/1.2 var(--serif);letter-spacing:.01em;color:#fff;text-shadow:0 6px 34px rgba(0,0,0,.55)}
.u .bub::before{content:"“";display:block;font:500 150px/.6 var(--it);color:var(--coral);margin:22px 0 4px -6px}
.u .hl{background:none;color:var(--coral)}
/* editorial line */
.a .bub{display:block;font:600 62px/1.42 var(--serif);color:var(--text);padding-left:34px;border-left:4px solid var(--coral)}
.note{font:400 25px/1.6 var(--sans);color:var(--muted);margin:0 72px;padding-top:8px;border-top:1px solid var(--hair)}
.typing{display:none}

/* glass cards */
.glass{border-radius:34px;background:var(--glass);border:2px solid var(--glassb);
  -webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.lab{font:600 23px/1.2 var(--latin);letter-spacing:.3em;color:var(--coral2);text-transform:uppercase}
.bignum{padding:40px 44px 44px}
.bignum .lb{font:500 32px/1.4 var(--sans);color:var(--muted);margin-top:16px}
.bignum .n{font:300 200px/1.02 var(--disp);letter-spacing:-.04em;margin-top:8px;color:#fff}
.bignum .n.cjk{font:700 128px/1.12 var(--serif);letter-spacing:.02em}
.bignum .n.coral{color:var(--coral)}
.bignum .sb{font:500 36px/1.45 var(--sans);color:var(--text);margin-top:18px;padding-top:22px;border-top:1px solid var(--hair)}
.card .ch{display:flex;align-items:baseline;gap:16px;padding:34px 40px 22px;font:700 40px/1.3 var(--serif);border-bottom:1px solid var(--hair)}
.card .ch .tag{margin-left:auto;font:600 20px/1 var(--latin);letter-spacing:.3em;color:var(--coral2)}
.card .cb{padding:8px 40px 28px}
.brow{display:flex;align-items:center;padding:24px 0;border-bottom:1px solid var(--hair)}
.brow:last-child{border-bottom:0}
.brow .l b{display:block;font:600 40px/1.3 var(--sans)}
.brow .l span{display:block;font-size:27px;color:var(--muted);margin-top:4px}
.brow .amt{margin-left:auto;font:300 64px/1 var(--disp);color:var(--coral2);letter-spacing:-.02em}
.btotal{display:flex;align-items:center;margin-top:12px;padding:26px 30px;border-radius:22px;background:rgba(255,107,74,.14);border:1px solid rgba(255,107,74,.45)}
.btotal b{font:700 38px/1.2 var(--serif)}
.btotal .amt{margin-left:auto;font:400 84px/1 var(--disp);color:var(--coral);letter-spacing:-.03em}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:28px 34px 10px}
.cmp .col{border-radius:24px;padding:26px 28px 28px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.cmp .col.hot{background:rgba(255,107,74,.13);border:2px solid rgba(255,107,74,.6)}
.cmp .col .nm{font:600 30px/1.3 var(--sans)}
.cmp .col .rt{font:500 40px/1 var(--latin);margin-top:14px;color:var(--muted)}
.cmp .col .fee{font:300 96px/1.05 var(--disp);letter-spacing:-.03em;margin-top:8px}
.cmp .col.hot .fee{color:var(--coral)}
.cmp .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}
.cmp .bar i{display:block;height:100%;background:rgba(255,255,255,.55)}
.cmp .col.hot .bar i{background:var(--coral)}
.cmp-foot{display:flex;align-items:center;gap:18px;padding:18px 40px 32px;font-size:28px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;font:700 32px/1 var(--sans);color:#160b07;background:var(--coral);border-radius:999px;padding:14px 28px}
.todo .it{display:flex;align-items:center;gap:26px;padding:26px 0;border-bottom:1px solid var(--hair);font:600 40px/1.35 var(--sans)}
.todo .it:last-child{border-bottom:0}
.todo .box{flex:none;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:30px;color:#160b07;font-weight:900}
.todo .it.on .box{background:var(--coral);border-color:var(--coral)}
.todo .it .n{font:300 54px/1 var(--disp);color:var(--coral2);width:40px}
/* sign-off */
.follow{padding:44px 46px 46px}
.follow .rule{width:90px;height:4px;background:var(--coral);margin-bottom:26px}
.follow b{display:block;font:600 34px/1 var(--latin);letter-spacing:.32em}
.follow span{display:block;font:600 50px/1.4 var(--serif);color:var(--text);margin-top:22px}
.follow .btn{margin-top:30px;display:inline-flex;align-items:center;justify-content:center;min-width:300px;height:86px;padding:0 40px;border-radius:999px;
  border:2px solid var(--coral);color:var(--coral);font:700 36px/1 var(--sans);letter-spacing:.08em}
.follow .btn.done{background:var(--coral);color:#160b07}

/* captions: white, keyword underlined in coral */
#cap{position:absolute;left:60px;right:60px;top:1350px;height:120px;display:flex;justify-content:center;align-items:center}
.capline{font:700 58px/1.25 var(--sans);color:#fff;text-align:center;letter-spacing:.01em;
  text-shadow:0 2px 6px rgba(0,0,0,.65),0 0 24px rgba(0,0,0,.5)}
.capline b{font-weight:800;border-bottom:6px solid var(--coral);padding-bottom:2px}
#src{position:absolute;left:72px;right:72px;top:1490px;font:400 19px/1.5 var(--latin);letter-spacing:.04em;color:rgba(244,241,234,.42);text-align:center}
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="cover"></div>
  <div id="grain"></div>
  <div class="issue"><b>TONYBOOK <i>·</i> 跨境</b><span id="epno">NO.001</span></div>
  <div class="kick" id="kick">CH.01<span></span></div>
  <div class="topic" id="topic"></div>
  <div id="view"><div id="chat"></div></div>
  <div id="cap"></div>
  <div id="src"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.write(`<script src="episodes/${q.get("ep") || "ep001"}.js"><\/script><script src="engine.js"><\/script>`);
</script>
</body>
</html>
