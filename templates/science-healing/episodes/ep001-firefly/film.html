<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// ======================================================================
//  萤火虫同步 · 全片  1080x1920 @30fps   时间轴与配音对齐（配音整体 +1.0s）
// ======================================================================
const W=1080,H=1920,FPS=30,DT=1/FPS,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let seed=20261028;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u,0,1);return u*u*(3-2*u)};
const ease=u=>{u=clamp(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const win=(t,a,b,f=0.6)=>clamp(Math.min((t-a)/f,(b-t)/f),0,1);   // fade window
const EVENTS=[];window.EVENTS=EVENTS;
function ev(type,t,extra){EVENTS.push(Object.assign({type,t:+t.toFixed(3)},extra||{}))}

// ---------- palette ----------
const SKY0='#03050b',SKY1='#0a1230',SKY2='#121b3c';
const GOLD='#f2c46b',INK='#f4f1ea';

// ---------- glow sprites ----------
function sprite(size,stops){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const r=size/2;const gr=g.createRadialGradient(r,r,0,r,r,r);for(const [o,col] of stops)gr.addColorStop(o,col);g.fillStyle=gr;g.fillRect(0,0,size,size);return c}
const SPR=sprite(96,[[0,'rgba(255,253,225,1)'],[0.12,'rgba(244,250,170,0.95)'],[0.35,'rgba(205,232,105,0.35)'],[0.7,'rgba(170,210,70,0.07)'],[1,'rgba(150,200,60,0)']]);
const SPRW=sprite(96,[[0,'rgba(255,248,232,1)'],[0.15,'rgba(255,226,170,0.9)'],[0.4,'rgba(242,190,110,0.3)'],[1,'rgba(240,180,90,0)']]);
const SPRS=sprite(64,[[0,'rgba(255,235,190,1)'],[0.3,'rgba(230,200,140,0.5)'],[1,'rgba(220,180,120,0)']]);

// ---------- grain & vignette ----------
const GR=[];for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=270;c.height=480;const g=c.getContext('2d');const im=g.createImageData(270,480);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);GR.push(c)}
const VIG=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const gr=g.createRadialGradient(W/2,H*0.48,H*0.22,W/2,H*0.48,H*0.72);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.78)');g.fillStyle=gr;g.fillRect(0,0,W,H);return c})();

// offscreen layers
function layer(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
const [glowC,glowX]=layer(270,480);
const [sceneC,sceneX]=layer(W,H);

// ======================================================================
//  WORLD: river + mangrove
// ======================================================================
const WATER=1395;          // waterline y
const stars=[];for(let i=0;i<340;i++)stars.push({x:rnd()*W,y:rnd()*1250,r:rnd()*1.5+0.25,p:rnd()*TAU,s:0.4+rnd()*1.4});
// distant treeline (bumpy silhouette)
const hills=[];{let y=0;for(let x=-20;x<=W+20;x+=6){y=0.85*y+(rnd()-0.5)*9;hills.push([x,WATER-26-Math.abs(Math.sin(x*0.011))*30-Math.abs(Math.sin(x*0.037+1))*16+y])}}
// mangrove: trunk, branches, canopy blobs, prop roots
const branches=[],blobs=[];
function grow(x,y,ang,len,w,d){
  const bend=(rnd()-0.5)*0.5;
  const mx=x+Math.cos(ang+bend)*len*0.5,my=y+Math.sin(ang+bend)*len*0.5;
  const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
  branches.push({x,y,mx,my,x2,y2,w});
  if(d<=0){for(let k=0;k<9;k++)blobs.push({x:x2+(rnd()-0.5)*120,y:y2+(rnd()-0.6)*90,r:10+rnd()*24});return}
  const n=d>5?2:(rnd()<0.6?2:3);
  for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*0.62+(rnd()-0.5)*0.5;grow(x2,y2,a,len*(0.7+rnd()*0.12),w*0.68,d-1)}
}
grow(540,1395,-Math.PI/2-0.04,215,34,7);
for(const b of branches){for(const k of ['x','mx','x2'])b[k]=540+(b[k]-540)*0.86}
for(const b of blobs){b.x=540+(b.x-540)*0.86;b.x=clamp(b.x,60,1020)}
const roots=[];for(let i=0;i<11;i++){const a=(i/10-0.5);roots.push({sx:540+a*30,sy:1250+rnd()*60,ex:540+a*560+(rnd()-0.5)*40,ey:WATER+8,cx:540+a*300,cy:1150+rnd()*120,w:5+rnd()*4})}
function drawTree(g,alpha){
  if(alpha<=0)return;g.save();g.globalAlpha=alpha;g.fillStyle='#020309';g.strokeStyle='#020309';g.lineCap='round';
  for(const r of roots){g.lineWidth=r.w;g.beginPath();g.moveTo(r.sx,r.sy);g.quadraticCurveTo(r.cx,r.cy,r.ex,r.ey);g.stroke()}
  for(const b of branches){g.lineWidth=b.w;g.beginPath();g.moveTo(b.x,b.y);g.quadraticCurveTo(b.mx,b.my,b.x2,b.y2);g.stroke()}
  g.globalAlpha=alpha*0.92;for(const b of blobs){g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill()}
  g.restore();
}
// ======================================================================
//  FIREFLIES (shared particle set)
// ======================================================================
const N=1500,F=[];
for(let i=0;i<N;i++){
  const b=blobs[Math.floor(rnd()*blobs.length)];const a=rnd()*TAU,rr=Math.sqrt(rnd())*b.r*1.6;
  const tx=clamp(b.x+Math.cos(a)*rr,50,1030),ty=b.y+Math.sin(a)*rr;
  // fly-in origin: far left/right darkness or from river
  const side=rnd()<0.5?-1:1;
  F.push({tx,ty,ox:540+side*(620+rnd()*400),oy:700+rnd()*900,cx:540+side*(200+rnd()*500),cy:300+rnd()*900,
          arr:0.9+Math.pow(rnd(),0.8)*4.6,fl:1.6+rnd()*1.2,
          ph:rnd(),om:1/(0.97+rnd()*0.06),rp:rnd(),rom:1/(0.7+rnd()*0.9),
          wx:rnd()*TAU,wy:rnd()*TAU,x:0,y:0,b:0,tw:rnd()*TAU,sz:0.8+rnd()*0.5});
}
// neighbours for sim
{const idx=F.map((f,i)=>i);for(const f of F){const d=idx.map(j=>[(F[j].tx-f.tx)**2+(F[j].ty-f.ty)**2,j]).sort((a,b)=>a[0]-b[0]);f.nb=d.slice(1,13).map(v=>v[1])}}
const CX=540,CY=880; // sync origin
for(const f of F){f.dist=Math.hypot(f.tx-CX,f.ty-CY)}
const flashShape=p=>p<0.14?Math.sin(Math.PI*p/0.14):0;

// Kuramoto sim (tree), runs every frame
let simK=0;
function simCoupling(t,f){ // spatial wave of coupling starting 34.4
  if(t<34.4)return 0;
  const front=(t-34.4)*190;           // px/s
  return 0.55*sm((front-f.dist)/260);
}
function stepSim(t){
  let re=0,im=0;for(const f of F){re+=Math.cos(TAU*f.ph);im+=Math.sin(TAU*f.ph)}
  const mph=Math.atan2(im,re)/TAU;
  const ph=F.map(f=>f.ph);
  let wraps=0,wrapX=0;
  for(const f of F){
    let c=0;for(const j of f.nb)c+=Math.sin(TAU*(ph[j]-f.ph));c/=12;
    const k=simCoupling(t,f);
    const np=f.ph+DT*(f.om+k*(c+0.5*Math.sin(TAU*(mph-f.ph))));
    if(np>=1){wraps++;wrapX+=f.tx}
    f.ph=(np%1+1)%1;
  }
  return {R:Math.hypot(re,im)/N,wraps,pan:wraps?wrapX/wraps/W:0.5};
}

// ======================================================================
//  TIMELINE
// ======================================================================
const T_END=62.5;
const SUBS=[
 {s:1.0,e:3.4,l:[['泰国的河边，有'],['一棵树',1],['。']]},
 {s:3.4,e:6.5,l:[['每到夜里，'],['几千只',1],['萤火虫落在上面。']]},
 {s:6.9,e:11.1,l:[['它们一起亮，一起灭，']],l2:[['像整棵树在'],['呼吸',1],['。']]},
 {s:11.5,e:14.0,cap:'1917 ·《科学》杂志',l:[['有人写道：'],['这不可能',1],['。']],paper:1},
 {s:14.0,e:17.3,l:[['是你'],['眼皮在跳',1],['，看错了。']],paper:1},
 {s:17.9,e:20.6,cap:'1960s · 泰国',l:[['直到生物学家'],['巴克夫妇',1]]},
 {s:20.6,e:23.6,l:[['去了泰国，'],['亲眼看见',1],['，还拍了下来。']]},
 {s:24.05,e:26.95,l:[['没有'],['指挥',1],['。']],l2:[['也没有哪一只，在带节奏。']]},
 {s:27.4,e:30.2,l:[['每只萤火虫，只做'],['一件事',1],['：']]},
 {s:30.2,e:34.15,l:[['看见旁边有光亮了，']],l2:[['就把节奏往前调'],['一点点',1],['。']]},
 {s:34.6,e:35.9,l:[['就'],['一点点',1],['。']]},
 {s:35.9,e:38.1,l:[['一夜之间，']],l2:[['几千个各自闪烁的小光点，']]},
 {s:38.1,e:40.3,l:[['变成了'],['同一个心跳',1],['。']]},
 {s:40.7,e:43.0,cap:'后来，科学家发现',l:[['心脏里的'],['起搏细胞',1]]},
 {s:43.0,e:44.7,cap:'后来，科学家发现',l:[['心脏里的'],['起搏细胞',1]]},
 {s:44.7,e:46.1,l:[['剧场里的'],['掌声',1]]},
 {s:46.1,e:47.7,l:[['并排走路的'],['两个人',1]]},
 {s:47.7,e:49.5,l:[['都是这样，慢慢'],['同步',1],['的。']]},
 {s:49.95,e:51.4,l:[['你也一样。']]},
 {s:51.4,e:54.7,l:[['你身边最常亮着的'],['那几盏灯',1],['，']],l2:[['正在一点点调你的节奏。']]},
 {s:55.1,e:62.0,big:1,l:[['想成为什么样的人，']],l2:[['先看看，你在'],['跟谁一起闪',1],['。']]},
];
// merge the two identical 起搏细胞 subs into one continuous
SUBS.splice(13,2,{s:40.7,e:44.7,cap:'后来，科学家发现',l:[['心脏里的'],['起搏细胞',1]]});

// scene weights
function wRiverA(t){return t<11.3?1:clamp(1-(t-11.3)/0.5,0,1)}
function wPaper(t){return win(t,11.3,17.45,0.5)}
function wFilm(t){return t<17.45?0:(t<17.75?clamp((t-17.45)/0.3,0,1):(t<23.8?1:clamp(1-(t-23.8)/0.5,0,1)))}
function wRiverB(t){return win(t,23.8,41.7,0.5)}
function wMacro(t){return win(t,27.0,34.5,0.6)}
function wVoid(t){return win(t,41.2,56.2,0.8)}
function wRiverC(t){return t<55.3?0:clamp((t-55.3)/0.9,0,1)*clamp((T_END-t)/1.2,0,1)}

// ======================================================================
//  RIVER SCENE (shared by A/B/C)
// ======================================================================
function cameraFor(t){
  // returns [scale, cx, cy] world point at screen centre
  if(t<11.5){const u=ease(t/11.5);return [lerp(1.0,1.13,u),540,lerp(1000,930,u)]}
  if(t<34.3){ // B: zoomed into canopy, slow drift
    const u=(t-23.8)/10.5;return [lerp(1.75,1.9,u),lerp(400,470,u),lerp(820,840,u)]}
  if(t<41.7){const u=ease((t-34.4)/3.6);return [lerp(1.9,1.0,u),lerp(470,540,u),lerp(840,960,u)]}
  const u=ease((t-55.3)/7);return [lerp(1.0,0.93,u),540,lerp(960,990,u)];
}
function riverBrightness(f,t){
  if(t<6.75){ // fly-in + random twinkle
    const flick=flashShape((f.rp+t*f.rom)%1)*0.75;
    return clamp(0.25+flick,0,1);
  }
  if(t<11.6){ // breathing in unison (1.5s period)
    const p=((t-6.75)/1.5)%1;const breath=Math.pow(Math.sin(Math.PI*p),2.2);
    const ramp=sm((t-6.75)/0.5);
    const flick=flashShape((f.rp+t*f.rom)%1)*0.75;
    return lerp(clamp(0.25+flick,0,1),0.06+breath*1.0,ramp);
  }
  return 0.05+flashShape(f.ph);  // sim driven
}
function flyPos(f,t){
  if(t>=f.arr+f.fl)return [f.tx,f.ty,1];
  const u=clamp((t-f.arr)/f.fl,0,1);if(t<f.arr)return [f.ox,f.oy,0];
  const e=ease(u);const a=1-e;
  const x=a*a*f.ox+2*a*e*f.cx+e*e*f.tx, y=a*a*f.oy+2*a*e*f.cy+e*e*f.ty;
  return [x+Math.sin(t*3+f.wx)*8*(1-e),y+Math.cos(t*2.6+f.wy)*8*(1-e),u];
}
function drawSky(g,t,meanB){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,SKY0);gr.addColorStop(0.52,SKY1);gr.addColorStop(0.72,SKY2);gr.addColorStop(0.73,'#070b18');gr.addColorStop(1,'#020308');
  g.fillStyle=gr;g.fillRect(-W,-H,W*3,H*3);
  for(const s of stars){g.globalAlpha=0.18+0.32*(0.5+0.5*Math.sin(t*s.s+s.p));g.fillStyle='#d6defc';g.beginPath();g.arc(s.x,s.y,s.r,0,TAU);g.fill()}
  g.globalAlpha=1;
  // horizon mist lit by fireflies
  const mg=g.createRadialGradient(540,WATER-60,10,540,WATER-60,700);
  const m=0.10+0.32*meanB;mg.addColorStop(0,`rgba(190,215,120,${m})`);mg.addColorStop(0.5,`rgba(120,150,110,${m*0.35})`);mg.addColorStop(1,'rgba(40,60,80,0)');
  g.fillStyle=mg;g.fillRect(-W,WATER-760,W*3,1000);
  // distant treeline
  g.fillStyle='#04060f';g.beginPath();g.moveTo(-W,WATER+2);for(const [x,y] of hills)g.lineTo(x,y);g.lineTo(W*2,WATER+2);g.closePath();g.fill();
}
function drawWater(g,t){
  const gr=g.createLinearGradient(0,WATER,0,H);gr.addColorStop(0,'#060a16');gr.addColorStop(1,'#010206');
  g.fillStyle=gr;g.fillRect(-W,WATER,W*3,H*2);
}
function drawFliesRiver(g,t,pos,bright,reflect){
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<N;i++){const b=bright[i];if(b<=0.01)continue;const [x,y]=pos[i];const f=F[i];
    const s=(9+b*40)*f.sz;g.globalAlpha=Math.min(1,0.15+b);g.drawImage(SPR,x-s/2,y-s/2,s,s);}
  if(reflect){
    g.beginPath();g.rect(-W,WATER+4,W*3,H);g.clip();
    for(let i=0;i<N;i+=1){const b=bright[i];if(b<=0.05)continue;const [x,y]=pos[i];if(y>WATER)continue;
      const ry=WATER+(WATER-y)*0.62;const rx=x+Math.sin(ry*0.045+t*2.2)*7;
      const s=(10+b*34)*F[i].sz;g.globalAlpha=Math.min(0.5,b*0.42);g.drawImage(SPR,rx-s/2,ry-s*0.3,s,s*0.6);}
  }
  g.restore();
  if(reflect){ // ripple lines
    g.save();g.globalAlpha=0.5;g.fillStyle='#03050c';for(let y=WATER+6;y<H+400;y+=7){g.globalAlpha=0.25+0.2*Math.sin(y*0.13+t*1.7);g.fillRect(-W,y,W*3,2.5)}g.restore();
  }
}
const posBuf=new Array(N),briBuf=new Float32Array(N);
function renderRiver(g,t,treeAlpha){
  const [sc,cx,cy]=cameraFor(t);
  let meanB=0;
  for(let i=0;i<N;i++){const f=F[i];let x,y,b;
    if(t<6.6){const fp=flyPos(f,t);x=fp[0];y=fp[1];b=riverBrightness(f,t)*(fp[2]>0?1:0);}
    else{x=f.tx;y=f.ty;b=riverBrightness(f,t)}
    // tiny idle sway
    x+=Math.sin(t*0.7+f.wx)*1.6;y+=Math.cos(t*0.6+f.wy)*1.4;
    posBuf[i]=[x,y];briBuf[i]=b;meanB+=b}
  meanB/=N;
  g.save();g.setTransform(sc,0,0,sc,W/2-cx*sc,H/2-cy*sc);
  drawSky(g,t,meanB);drawWater(g,t);drawTree(g,treeAlpha);
  drawFliesRiver(g,t,posBuf,briBuf,true);
  g.restore();
  // bloom pass
  glowX.setTransform(1,0,0,1,0,0);glowX.clearRect(0,0,270,480);
  glowX.setTransform(sc/4,0,0,sc/4,(W/2-cx*sc)/4,(H/2-cy*sc)/4);
  glowX.globalCompositeOperation='lighter';
  for(let i=0;i<N;i+=2){const b=briBuf[i];if(b<0.3)continue;const [x,y]=posBuf[i];const s=70*b;glowX.globalAlpha=b*0.5;glowX.drawImage(SPR,x-s/2,y-s/2,s,s)}
  g.save();g.globalCompositeOperation='lighter';g.filter='blur(10px)';g.globalAlpha=0.9;g.drawImage(glowC,0,0,W,H);g.restore();
  return meanB;
}
// "searching for a leader" ring in B (24–27)
const leaderSeq=[];for(let k=0;k<7;k++)leaderSeq.push(Math.floor(rnd()*N));
function drawLeaderSearch(g,t){
  if(t<24.3||t>27.2)return;const k=Math.floor((t-24.3)/0.42);const i=leaderSeq[k%leaderSeq.length];const f=F[i];
  const [sc,cx,cy]=cameraFor(t);const x=W/2+(f.tx-cx)*sc,y=H/2+(f.ty-cy)*sc;
  const u=((t-24.3)/0.42)%1;const a=win(t,24.3,27.2,0.4)*Math.sin(Math.PI*u)*0.8;
  g.save();g.globalAlpha=a;g.strokeStyle=GOLD;g.lineWidth=2;g.beginPath();g.arc(x,y,30+u*10,0,TAU);g.stroke();
  g.font='500 30px "Noto Serif CJK SC"';g.fillStyle=GOLD;g.textAlign='center';g.fillText('?',x,y-48);g.restore();
}

// ======================================================================
//  PAPER SCENE (1917)
// ======================================================================
const paperTex=(()=>{const [c,g]=layer(W,H);g.fillStyle='#d8c7a0';g.fillRect(0,0,W,H);
  const im=g.getImageData(0,0,W,H);for(let i=0;i<im.data.length;i+=4){const n=(rnd()-0.5)*26;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n*0.8}g.putImageData(im,0,0);
  for(let k=0;k<60;k++){g.fillStyle=`rgba(120,90,50,${0.02+rnd()*0.05})`;g.beginPath();g.arc(rnd()*W,rnd()*H,20+rnd()*160,0,TAU);g.fill()}
  const vg=g.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.7);vg.addColorStop(0,'rgba(80,50,20,0)');vg.addColorStop(1,'rgba(60,35,10,0.55)');g.fillStyle=vg;g.fillRect(0,0,W,H);return c})();
const bodyLines=[];for(let col=0;col<2;col++)for(let r=0;r<34;r++)bodyLines.push({x:120+col*440,y:1030+r*30,w:(r%9==8)?200+rnd()*120:360+rnd()*20});
function renderPaper(g,t){
  const lt=t-11.3;
  const sc=lerp(1.0,1.08,ease(lt/6));
  g.save();g.translate(W/2,H/2);g.scale(sc,sc);g.rotate(-0.012);g.translate(-W/2,-H/2);
  g.drawImage(paperTex,0,0);
  g.fillStyle='#2b2015';g.textAlign='center';
  g.font='700 132px "DejaVu Serif"';g.fillText('SCIENCE',540,780);
  g.fillRect(110,820,860,4);g.fillRect(110,832,860,1.5);
  g.font='italic 28px "DejaVu Serif"';g.fillText('NEW SERIES · VOL. XLV · 1917',540,880);
  g.font='600 34px "DejaVu Serif"';
  const title='THE SUPPOSED SYNCHRONAL FLASHING OF FIREFLIES';
  // typed reveal
  const n=Math.floor(clamp((lt-0.8)/2.2,0,1)*title.length);
  g.font='700 27px "DejaVu Serif"';g.fillText(title.slice(0,n),540,975);
  g.globalAlpha=0.32;for(const b of bodyLines){if(b.y>1500&&b.y<1780&&Math.abs(b.x+b.w/2-540)<300)continue;g.fillRect(b.x,b.y,b.w,9)}g.globalAlpha=1;
  g.restore();
  // ink eye

  const q=slot%31;let px,py;if(q<24){const a=(q%8)/8*TAU,rr=(Math.floor(q/8)+1)/3;px=Math.cos(a)*rr*13;py=6+Math.sin(a)*rr*24}else{const k=q-24;px=(k-3)*6.5;py=-30-Math.abs(k-3)*2.5}

}
// S9: you + six lights
const YOU={x:540,y:1060};const NEAR=[];{for(let k=0;k<6;k++){const a=-Math.PI/2+k*TAU/6+0.35*(rnd()-0.5);const r=210+rnd()*130;NEAR.push({x:540+Math.cos(a)*r,y:1060+Math.sin(a)*r*1.1})}}
const ROLE=new Int16Array(N);for(let i=0;i<N;i++)ROLE[i]=i<60?0:(i<240?1:2); // 0: you, 1: near lights, 2: far bokeh

// beat helpers

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const layers=[[wRiverA(t),g=>renderRiver(g,t,1)],[wPaper(t),g=>renderPaper(g,t)],[wFilm(t),g=>renderFilm(g,t)],
                [wRiverB(t),g=>{renderRiver(g,t,1);drawLeaderSearch(g,t)}],[wMacro(t),g=>renderMacro(g,t)],
                [wVoid(t),g=>renderVoid(g,t)],[wRiverC(t),g=>renderRiver(g,t,1)]];
  for(const [w,fn] of layers){if(w<=0.001)continue;
    if(w>=0.999){ctx.save();fn(ctx);ctx.restore()}
    else{sceneX.setTransform(1,0,0,1,0,0);sceneX.globalAlpha=1;sceneX.filter='none';sceneX.globalCompositeOperation='source-over';sceneX.fillStyle='#000';sceneX.fillRect(0,0,W,H);sceneX.save();fn(sceneX);sceneX.restore();ctx.save();ctx.globalAlpha=w;ctx.drawImage(sceneC,0,0);ctx.restore()}}
  // vignette + grain (paper scene gets lighter vignette)
  ctx.save();ctx.globalAlpha=wPaper(t)>0.5?0.45:1;ctx.drawImage(VIG,0,0);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.05+0.07*wFilm(t)+0.04*wPaper(t);ctx.drawImage(GR[frame%6],0,0,W,H);ctx.restore();
  drawSubs(ctx,t);
  // global fade in/out
  const fin=clamp(t/0.8,0,1),fout=clamp((T_END-t)/1.0,0,1);
  if(fin<1||fout<1){ctx.fillStyle=`rgba(0,0,0,${1-Math.min(fin,fout)})`;ctx.fillRect(0,0,W,H)}
  frame++;return t;
};
window.TOTAL=Math.round(T_END*FPS);
</script></body></html>
